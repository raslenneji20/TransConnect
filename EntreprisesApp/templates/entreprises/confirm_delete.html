{% extends "base.html" %}
{% load ui_translation %}
{% block title %}{% t "confirm_delete" %} | TransConnect{% endblock %}
{% block content %}
<section class="page-wrap">
    <header class="page-heading"><div><span class="eyebrow">{% t "eyebrow_confirm" %}</span><h1>{% t "confirm_delete" %}</h1></div></header>
    <div class="content-panel confirm-panel">
        <p>{% t "confirm_company_delete" %}</p>
        <form method="post">
            {% csrf_token %}
            <div class="page-actions">
                <button class="btn delete" type="submit">{% t "yes_delete" %}</button>
                <a class="btn secondary" href="{% url 'entreprises:liste' %}">{% t "cancel" %}</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
