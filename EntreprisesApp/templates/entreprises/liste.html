

{% block content %}
<h2>Entreprises</h2>
<ul>
{% for entreprise in entreprises %}
<li>
    <a href="{% url 'entreprises:detail_entreprise' entreprise.pk %}">
        {{ entreprise.reference }}
    </a>
    — {{ entreprise.matricule_fiscale }} ({{ entreprise.raison_sociale }})
    <a href="{% url 'entreprises:delete' entreprise.pk %}">Supprimer</a>
    <br>
</li>

{% empty %}
<li>Aucune entreprise disponible pour le moment.</li>
{% endfor %}
</ul>
{% endblock %}
