{% load static ui_translation %}
<!doctype html>
<html lang="{{ request.LANGUAGE_CODE|default:'fr' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>{% block title %}TransConnect{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'app.css' %}">
    <link rel="stylesheet" href="{% static 'lists.css' %}">
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <header class="site-header">
        <nav class="site-nav" aria-label="{% t 'nav_aria' %}">
            <a class="brand" href="{% url 'expeditions:liste' %}">
                <span class="brand-mark" aria-hidden="true">T</span>
                <span class="brand-copy">
                    <strong>TransConnect</strong>
                    <small>{% t "brand_tagline" %}</small>
                </span>
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
                <span class="sr-only">{% t "open_navigation" %}</span>
                <span></span><span></span><span></span>
            </button>
            <div class="nav-content" id="primary-navigation">
                <div class="nav-links">
                    <a href="{% url 'expeditions:liste' %}">{% t "nav_expeditions" %}</a>
                    <a href="{% url 'entreprises:liste' %}">{% t "nav_companies" %}</a>
                    <a href="{% url 'vehicules:liste' %}">{% t "nav_vehicles" %}</a>
                    <a href="{% url 'offres:liste' %}">{% t "nav_offers" %}</a>
                </div>
                <form class="language-switch" action="{% url 'set_language' %}" method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.get_full_path }}">
                    <label class="sr-only" for="language-choice">{% t "language_label" %}</label>
                    <select id="language-choice" name="language" onchange="this.form.submit()">
                        <option value="fr" {% if request.LANGUAGE_CODE == 'fr' %}selected{% endif %}>FR</option>
                        <option value="en" {% if request.LANGUAGE_CODE == 'en' %}selected{% endif %}>EN</option>
                    </select>
                </form>
            </div>
        </nav>
    </header>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">{% t "footer_note" %}</footer>
    <script src="{% static 'app.js' %}" defer></script>
</body>
</html>
