{% extends "base.html" %}
{% block title %}Supprimer {{ expedition.reference }}{% endblock %}
{% block content %}
<h2>Confirmer la suppression</h2>
<p>Supprimer définitivement l'expédition <strong>{{ expedition.reference }}</strong> ?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Oui, supprimer</button>
  <a href="{% url 'expeditions:detail' expedition.reference %}">Annuler</a>
</form>
{% endblock %}
